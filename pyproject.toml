[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oats-scan"
version = "0.2.0"
description = "See what the agent skills on your machine tell an AI agent to run (the `oats scan` of pheo-oats)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Pheo", email = "hello@pheo.ai"}]
keywords = ["ai", "agents", "agent-skills", "security", "governance", "claude", "cursor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
# The scanner and its classifier are pheo-oats'. 0.7.1 is the first that
# does everything oats-scan did (see pheo-oats' CHANGELOG).
dependencies = ["pheo-oats>=0.7.1"]

[project.urls]
Homepage = "https://pheo.ai"
Source = "https://github.com/pheo-ai/oats-scan"
Issues = "https://github.com/pheo-ai/oats-scan/issues"

[project.scripts]
oats-scan = "oats_scan.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
